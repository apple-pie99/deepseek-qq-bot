name: 问题反馈
description: 部署/运行中卡住了，或某个行为不对
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **先做两件事**：① 看 [常见问题](../../docs/常见问题.md)，按现象查一遍；
        ② 跑 `诊断\收集日志.bat`，生成的 zip 里 API Key 与 token 已自动打码。

  - type: textarea
    id: symptom
    attributes:
      label: 现象
      description: 你看到什么？期望是什么？大概多久出现一次？
      placeholder: 群里 @ 机器人没有反应，NapCat 显示已连接，6185 能打开。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从哪一步开始出问题的（装了 QQ / 下载依赖 / 跑向导 / 接 NapCat / 改配置）
      placeholder: |
        1. 全新解压，跑 installer\下载依赖.bat（成功）
        2. 跑 3_一键启动.bat，看到 6185（成功）
        3. ...
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: 版本
      description: AstrBot / NapCat / QQ / Windows
      placeholder: AstrBot 4.29.1 portable / NapCat 4.18.x Shell / QQ NT 9.9.x / Win11 24H2
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 诊断 zip 内容摘要
      description: 把 `诊断_<时间戳>.zip` 里的关键日志贴上来（Key 与 token 已打码，可以直接贴）
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 自查
      options:
        - label: 我用的是 QQ 小号，并且知道非官方接入有封号风险
          required: true
        - label: 我已经看过 docs/常见问题.md 里对应的现象
          required: true
        - label: 这不是"NapCat 需要更新 / QQ 自动更新导致失效"这类已知问题
          required: false
